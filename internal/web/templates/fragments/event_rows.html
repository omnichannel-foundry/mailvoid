{{define "event_rows"}}
{{range .}}
<tr class="event-row hover" data-event-id="{{.ID}}">
  <td class="whitespace-nowrap align-top">
    <span class="text-xs opacity-60">{{formatTime .Timestamp}}</span>
  </td>
  <td class="align-top"><span class="badge badge-sm {{severityClass .Severity}}">{{.Severity}}</span></td>
  <td class="align-top"><code class="text-xs">{{.Type}}</code></td>
  <td class="align-top">
    <details>
      <summary class="cursor-pointer text-xs opacity-70">payload</summary>
      <pre class="mv-pre mt-2 rounded-lg bg-base-300/60 p-2">{{jsonPretty .Payload}}</pre>
    </details>
  </td>
</tr>
{{else}}
<tr><td colspan="4" class="py-10 text-center text-sm opacity-50">No events recorded yet.</td></tr>
{{end}}
{{end}}
