{{define "content"}}
<div class="card mv-card w-full max-w-md">
  <div class="card-body items-center gap-4 text-center">
    <span class="mv-brand-mark text-xl">M</span>
    <div class="mv-eyebrow">Request failed</div>
    <h1 class="text-4xl font-extrabold tracking-tight">{{.Status}}</h1>
    <p class="text-sm leading-relaxed opacity-60">{{.Message}}</p>
    <a class="btn btn-primary btn-sm" href="/">Back to dashboard</a>
  </div>
</div>
{{end}}
