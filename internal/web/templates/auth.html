{{define "auth"}}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · MailVoid</title>
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("mailvoid-theme")||"dark")}catch(e){}</script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="mv-app min-h-screen bg-base-200 text-base-content">
<main class="mv-auth-main mx-auto flex min-h-screen w-full flex-col items-center justify-center p-5 sm:p-8">
  {{template "content" .}}
  <footer class="mv-footer mt-6 border-0 text-xs">MailVoid {{.Version}}</footer>
</main>
<script src="/static/cash.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
{{end}}
